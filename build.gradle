plugins {
    id 'java'
    id 'maven-publish'
    id 'jacoco'
    id 'checkstyle'
}

group = 'io.lemonade'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

checkstyle {
    toolVersion = '10.14.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
}

configurations.matching { it.name.startsWith('checkstyle') }.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability('com.google.collections', 'google-collections') {
        select('com.google.guava:guava:0')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'io.lemonade'
            artifactId = 'record-data'
            version = '0.1.0-SNAPSHOT'

            pom {
                name = 'record-data'
                description = 'Java XML and JSON Record Mapping Library'
                url = 'https://github.com/json2record/record-data'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'json2record'
                        name = 'json2record team'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/json2record/record-data.git'
                    developerConnection = 'scm:git:ssh://github.com/json2record/record-data.git'
                    url = 'https://github.com/json2record/record-data'
                }
            }
        }
    }
}
